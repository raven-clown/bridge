version: 2

project_name: bridge

builds:
  - main: ./cmd/bridge
    binary: bridge
    env:
      - CGO_ENABLED=0
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: darwin
        goarch: amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

# Release notes come from CHANGELOG.md, written by hand.
changelog:
  disable: true

# Homebrew and winget publishing waits for raven-clown/homebrew-tap and a
# winget-pkgs fork. Add brews: and winget: sections here once they exist.
